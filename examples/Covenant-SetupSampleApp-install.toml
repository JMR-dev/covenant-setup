app_name = 'Covenant-Setup Sample App'

[directories]
paths = [
  '{LocalAppData}\CovenantSetupSample',
  '{LocalAppData}\CovenantSetupSample\bin'
]

[[files]]
source = 'payload\sample_app.cmd'
destination = '{LocalAppData}\CovenantSetupSample\bin\sample_app.cmd'

[[files]]
source = 'payload\post_install.ps1'
destination = '{LocalAppData}\CovenantSetupSample\post_install.ps1'

[[registry]]
key = 'HKCU\Software\CovenantSetupSample'
name = 'InstallRoot'
value = '{LocalAppData}\CovenantSetupSample'

[[shortcuts]]
path = '{Desktop}\CovenantSetupSample.lnk'
target = '{LocalAppData}\CovenantSetupSample\bin\sample_app.cmd'
description = 'Launch the Covenant-Setup sample payload'

# The post-install script is copied into the install root above, so it is
# invoked by name with the working directory already pointing there. This keeps
# the script locatable for both direct and packaged (temp-extracted) installs,
# where the manifest's own directory is not the process working directory.
[[scripts]]
command = 'powershell'
args = [
  '-ExecutionPolicy',
  'Bypass',
  '-File',
  'post_install.ps1'
]
working_directory = '{LocalAppData}\CovenantSetupSample'

[purge]
registry_branches = ['HKCU\Software\CovenantSetupSample']
paths = ['{LocalAppData}\CovenantSetupSample']
