app_name = "Covenant-Setup Sample App"

[[directories]]
path = "{LocalAppData}\\CovenantSetupSample"

[[directories]]
path = "{LocalAppData}\\CovenantSetupSample\\bin"

[[files]]
source = "payload\\sample_app.cmd"
destination = "{LocalAppData}\\CovenantSetupSample\\bin\\sample_app.cmd"

[[registry]]
key = "HKCU\\Software\\CovenantSetupSample"
name = "InstallRoot"
value = "{LocalAppData}\\CovenantSetupSample"

[[shortcuts]]
path = "{Desktop}\\Covenant-Setup Sample App.lnk"
target = "{LocalAppData}\\CovenantSetupSample\\bin\\sample_app.cmd"
description = "Launch the Covenant-Setup sample payload"

[[scripts]]
command = "powershell"
args = [
  "-ExecutionPolicy",
  "Bypass",
  "-Command",
  "New-Item -ItemType Directory -Path .\\logs -Force | Out-Null; 'post-install script ran' | Set-Content .\\logs\\post_install.txt"
]
working_directory = "{LocalAppData}\\CovenantSetupSample"

[purge]
registry_branches = ["HKCU\\Software\\CovenantSetupSample"]
paths = ["{LocalAppData}\\CovenantSetupSample"]
